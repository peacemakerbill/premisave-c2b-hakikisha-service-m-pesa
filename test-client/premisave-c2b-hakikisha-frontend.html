/* =========================================================
   Tokens. Colour tokens live in the theme blocks above;
   fonts and corner radius in the data-font and data-radius blocks.
   ========================================================= */
:root{
  --sans:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --display:"IBM Plex Sans Condensed","IBM Plex Sans","Arial Narrow","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace;
  --radius:3px;
  --side-w:240px;
  /* older names used by the page logic, mapped onto the theme tokens */
  --canvas:var(--bg); --sunken:var(--panel-2); --hover:var(--panel-2);
  --line2:var(--line-2); --ink2:var(--ink-2); --ink3:var(--ink-3);
  --ok:var(--good); --info:var(--j-num);
  --ok-soft:color-mix(in srgb,var(--good) 14%,var(--panel));
  --bad-soft:color-mix(in srgb,var(--bad) 14%,var(--panel));
  --warn-soft:color-mix(in srgb,var(--warn) 15%,var(--panel));
  --info-soft:color-mix(in srgb,var(--j-num) 14%,var(--panel));
  --pop:0 10px 28px rgba(0,0,0,.35);
}

/* =========================================================
   Base
   ========================================================= */
*{box-sizing:border-box}
html,body{height:100%;margin:0}
#app{height:100%}
body{font:14px/1.5 var(--sans);background-color:var(--bg);background-image:var(--pattern);background-size:var(--pattern-size);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{margin:0;font-weight:600}
h1,h2{font-family:var(--display)}
h3{font-size:14px} h4{font-size:12.5px;color:var(--ink-2)}
code,pre,.mono{font-family:var(--mono);font-size:12.5px}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-old(root){z-index:1}
::view-transition-new(root){z-index:2}
.hidden{display:none!important}
.muted{color:var(--ink-2)} .tiny{font-size:12px} .grow{flex:1;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:12px}
.ic{display:inline-grid;place-items:center;flex:none}
.ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.kbd{display:inline-block;font-family:var(--mono);font-size:11px;padding:0 6px;border:1px solid var(--line-2);background:var(--panel-2);color:var(--ink-2)}

/* brand mark */
.mark{display:flex;align-items:center;gap:11px;font-weight:600}
.mark .logo{width:30px;height:30px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.mark small{display:block;font-weight:400;font-size:11.5px;color:var(--ink-3);line-height:1.2;margin-top:1px}

/* =========================================================
   Shell
   ========================================================= */
.shell{height:100%;display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);grid-template-rows:100%}
.side{background:var(--panel);border-right:1px solid var(--line-2);display:flex;flex-direction:column;min-height:0}
.side .mark{padding:16px 16px 14px;border-bottom:1px solid var(--line)}
.nav{overflow-y:auto;padding:4px 0 12px;flex:1}
.nav-title{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);padding:16px 16px 6px;font-weight:700}
.nav button{display:flex;align-items:center;gap:11px;width:100%;height:36px;padding:0 16px;border:0;border-left:3px solid transparent;background:none;color:var(--ink-2);text-align:left;font-weight:600;font-size:13px}
.nav button:hover{background:var(--panel-2);color:var(--ink)}
.nav button.on{background:var(--accent-soft);border-left-color:var(--accent);color:var(--ink)}
.side-foot{padding:8px 0;border-top:1px solid var(--line)}
.foot-btn{display:flex;align-items:center;gap:11px;width:100%;height:36px;padding:0 16px;border:0;border-left:3px solid transparent;background:none;color:var(--ink-2);text-align:left;font-weight:600;font-size:13px}
.foot-btn:hover{background:var(--panel-2);color:var(--ink)}
.foot-btn .tn{margin-left:auto;font-size:11px;color:var(--ink-3);font-weight:400;white-space:nowrap}
.svc{display:flex;align-items:center;gap:11px;width:100%;height:30px;padding:0 16px;border:0;background:none;color:var(--ink-3);font-size:12px;text-align:left}
.svc:hover{color:var(--ink)}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:12px;min-height:60px;padding:0 28px;border-bottom:1px solid var(--line-2);background:var(--panel);flex:none}
.top h1{font-size:26px;line-height:1.1;white-space:nowrap}
.spacer{flex:1}
.icon-btn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:var(--radius);border:1px solid transparent;background:transparent;color:var(--ink-2);flex:none}
.icon-btn:hover{background:var(--panel-2);color:var(--ink)}
.icon-btn[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink)}
.content{flex:1;overflow-y:auto;padding:24px 28px 64px;position:relative}
.page{max-width:1180px;margin:0 auto}
.page>*{min-width:0}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.page-head p{margin:0;color:var(--ink-2);max-width:74ch}
.env{display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 10px;border:1px solid var(--line-2);color:var(--ink-2);font-family:var(--mono);font-size:11.5px;background:var(--panel);border-radius:var(--radius)}

/* live control */
.live-btn{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 11px;border-radius:var(--radius);border:1px solid var(--line-2);background:var(--panel);color:var(--ink-2);font-weight:600;font-size:12.5px}
.live-btn:hover{border-color:var(--ink-2);color:var(--ink)}
.live-btn .pulse{width:9px;height:9px;background:var(--good);flex:none;animation:pulse 2.4s ease-in-out infinite}
.live-btn.busy .pulse{background:var(--accent);animation-duration:.7s}
.live-btn.off .pulse{background:var(--ink-3);animation:none}
.live-btn.bad .pulse{background:var(--bad);animation:none}
.live-btn.bad{color:var(--bad);border-color:var(--bad)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.live-menu{width:330px}
.live-menu .pill-tabs{width:100%}
.live-menu .pill-tabs button{flex:1;padding:0 6px}

/* account menu */
.who{position:relative}
.who>button{display:flex;align-items:center;gap:8px;height:34px;padding:0 8px 0 4px;border-radius:var(--radius);border:1px solid var(--line-2);background:var(--panel)}
.who>button:hover{border-color:var(--ink-2)}
.avatar{width:24px;height:24px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.menu{position:absolute;right:0;top:calc(100% + 6px);width:330px;background:var(--panel);border:1px solid var(--line-2);box-shadow:var(--pop);padding:4px;z-index:40}
.menu .it{display:flex;align-items:center;gap:10px;padding:7px 8px;cursor:pointer}
.menu .it:hover{background:var(--panel-2)}
.menu .it.on{background:var(--accent-soft)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}

/* tabs and segmented */
.tabs{display:flex;gap:22px;flex-wrap:wrap;margin:0 0 16px;border-bottom:1px solid var(--line-2);max-width:100%}
.tabs button{padding:8px 0 9px;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;background:transparent;font-weight:600;color:var(--ink-2);white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.pill-tabs{display:inline-flex;border:1px solid var(--line-2);max-width:100%;border-radius:var(--radius);overflow:hidden;flex-wrap:wrap}
.pill-tabs button{border:0;border-left:1px solid var(--line-2);background:var(--panel);color:var(--ink-2);padding:0 14px;height:32px;font-weight:600;min-width:0}
.pill-tabs button:first-child{border-left:0}
.pill-tabs button:hover{background:var(--panel-2);color:var(--ink)}
.pill-tabs button.on{background:var(--accent);color:var(--accent-ink)}

/* =========================================================
   Controls
   ========================================================= */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:34px;padding:0 14px;border-radius:var(--radius);border:1px solid var(--line-2);background:var(--panel);color:var(--ink);font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sun{color:var(--warn);border-color:var(--warn)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger:hover{background:var(--panel-2)}
.btn.danger.fill{background:var(--bad);border-color:var(--bad);color:var(--panel)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--panel-2);color:var(--ink);border-color:transparent}
.btn.sm{height:28px;padding:0 10px;font-size:12px;gap:6px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.busy::after{content:"";width:11px;height:11px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
label.f{display:flex;flex-direction:column;gap:5px;min-width:0}
label.f>span{font-size:12px;font-weight:600;color:var(--ink-2)}
label.f>span em{font-style:normal;color:var(--ink-3);font-weight:400}
input[type=text],input[type=number],input[type=password],input[type=email],input[type=date],input[type=time],input[type=datetime-local],input[type=url],select,input:not([type]){height:36px;border:1px solid var(--line-2);background:var(--field);border-radius:var(--radius);padding:0 10px;width:100%;min-width:0;color:var(--ink)}
select{padding-right:6px}
textarea{border:1px solid var(--line-2);background:var(--field);border-radius:var(--radius);padding:8px 10px;width:100%;min-width:0;font:12px/1.5 var(--mono);min-height:84px;resize:vertical;color:var(--ink)}
::placeholder{color:var(--ink-3)}
input:hover,select:hover,textarea:hover{border-color:var(--ink-3)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
input[type=file]{font-size:12.5px;width:100%;height:auto;padding:5px 8px}
input[type=checkbox],input[type=radio],input[type=range]{accent-color:var(--accent)}
input[type=checkbox]{width:15px;height:15px;margin:0}
.chk{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:13px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.auto{grid-template-columns:repeat(auto-fill,minmax(256px,1fr))}
.auto-w{grid-template-columns:repeat(auto-fill,minmax(420px,1fr))}
.hr{height:1px;background:var(--line);margin:14px 0;border:0}

/* =========================================================
   Surfaces
   ========================================================= */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.card.flat{background:var(--panel-2)}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.card-h h3{flex:1;min-width:0;font-family:var(--display);font-size:17px}
.tag{font:11.5px var(--mono);color:var(--ink-3);white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border:1px solid var(--line-2);border-radius:2px;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap;background:transparent}
.chip.plain{text-transform:none;letter-spacing:0;font-size:12px;height:22px}
.chip.ok{color:var(--good);border-color:var(--good)} .chip.bad{color:var(--bad);border-color:var(--bad)}
.chip.warn,.chip.sun{color:var(--warn);border-color:var(--warn)} .chip.info{color:var(--j-num);border-color:var(--j-num)}
.chip.brand{color:var(--accent);border-color:var(--accent)}
.method{display:inline-block;min-width:48px;text-align:center;font:500 10.5px var(--mono);padding:2px 0;border-radius:2px;letter-spacing:.06em;border:1px solid currentColor;background:transparent}
.m-GET{color:var(--j-num)} .m-POST{color:var(--good)} .m-PUT,.m-PATCH{color:var(--warn)} .m-DELETE{color:var(--bad)}
.path{font:11.5px var(--mono);color:var(--ink-3);word-break:break-all}
.empty{padding:22px;text-align:center;color:var(--ink-3);border:1px dashed var(--line-2);font-size:12.5px;border-radius:var(--radius)}
.kv{display:grid;grid-template-columns:minmax(130px,max-content) 1fr;gap:7px 20px;font-size:13px;margin:0}
.kv dt{color:var(--ink-3);font-size:12.5px} .kv dd{margin:0;word-break:break-word;font-variant-numeric:tabular-nums}
.notice{padding:10px 14px;background:var(--panel);border:1px solid var(--line-2);border-left:4px solid var(--j-num);color:var(--ink-2);font-size:12.5px;border-radius:var(--radius)}
.notice.warn{border-left-color:var(--warn)} .notice.bad{border-left-color:var(--bad)} .notice.ok{border-left-color:var(--good)}
.dot{display:inline-block;width:9px;height:9px;background:var(--ink-3);flex:none}
.dot.ok{background:var(--good)} .dot.bad{background:var(--bad)} .dot.warn{background:var(--warn)}
.idline{font:11.5px var(--mono);color:var(--ink-3);cursor:pointer;word-break:break-all}
.idline:hover{color:var(--accent)}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:9px 12px;border-bottom:1px solid var(--line-2);position:sticky;top:0;background:var(--panel)}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:var(--panel-2)}
.scroll{overflow:auto;max-height:560px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}

.toolbar{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:12px;margin-bottom:18px}
.toolbar .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.toolbar .filters>*{flex:1 1 150px}
.toolbar .filters>.btn{flex:none}
.toolbar .pill-tabs{align-self:flex-start}

/* endpoint card */
.ep{border:1px solid var(--line);background:var(--panel);border-radius:var(--radius);overflow:hidden}
.ep-h{display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:46px;cursor:pointer}
.ep-h:hover{background:var(--panel-2)}
.ep-h b{font-weight:600;white-space:nowrap}
.ep-h .path{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;word-break:normal}
.ep-h .car{color:var(--ink-3);transition:transform .12s;width:14px;height:14px}
.ep.open .car{transform:rotate(90deg)}
.ep.open .ep-h{border-bottom:1px solid var(--line);background:var(--panel-2)}
.ep-b{display:none;padding:2px 14px 16px}
.ep.open .ep-b{display:block}
.ep-b .desc{color:var(--ink-2);margin:12px 0;font-size:12.5px}
.ep-b .grid{margin-top:12px}
.fields{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.res{margin-top:14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);overflow:hidden}
.res-h{display:flex;align-items:center;gap:10px;padding:6px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--panel-2);min-height:36px}
.res-b{padding:12px;max-height:480px;overflow:auto}
.pre{font:12px/1.55 var(--mono);white-space:pre-wrap;word-break:break-word;margin:0}
.j-k{color:var(--j-key)} .j-s{color:var(--j-str)} .j-n{color:var(--j-num)} .j-b{color:var(--j-lit)} .j-z{color:var(--ink-3)}
details.jv>summary{cursor:pointer;list-style:none;font:12px var(--mono)}
details.jv>summary::-webkit-details-marker{display:none}
details.jv>summary::before{content:"+";display:inline-block;width:14px;color:var(--ink-3)}
details.jv[open]>summary::before{content:"\2212"}
.jv-in{margin-left:6px;border-left:1px solid var(--line-2);padding-left:12px;font:12px/1.6 var(--mono)}
.stat{display:inline-block;font:500 11.5px var(--mono);padding:1px 6px;border-radius:2px;border:1px solid currentColor}
.s2{color:var(--good)} .s3{color:var(--j-num)} .s4{color:var(--warn)} .s5,.s0{color:var(--bad)}

/* =========================================================
   Overlays
   ========================================================= */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:90;display:flex;justify-content:flex-end}
.drawer{width:min(800px,100%);background:var(--bg);background-image:var(--pattern);background-size:var(--pattern-size);height:100%;overflow:auto;box-shadow:var(--pop);border-left:1px solid var(--line-2);animation:slide .16s ease-out}
@keyframes slide{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.drawer-h{position:sticky;top:0;z-index:2;background:var(--panel);border-bottom:1px solid var(--line-2);padding:0 20px;min-height:56px;display:flex;align-items:center;gap:10px}
.drawer-h h3{font-family:var(--display);font-size:20px}
.drawer-b{padding:20px;display:flex;flex-direction:column;gap:16px}
.modal-wrap{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:110;display:grid;place-items:center;padding:20px}
.modal{background:var(--panel);border:1px solid var(--line-2);padding:0 16px 18px;width:min(560px,100%);box-shadow:var(--pop);max-height:92vh;overflow:auto;border-radius:var(--radius)}
.modal.wide{width:min(980px,100%)}
.modal>h3,.modal>.row:first-child>h3{font:700 11px var(--sans);text-transform:uppercase;letter-spacing:.1em;color:var(--ink-2)}
.modal>h3{margin:0 -16px 16px;padding:0 16px;min-height:46px;display:flex;align-items:center;background:var(--panel-2);border-bottom:1px solid var(--line)}
.modal>.row:first-child{margin:0 -16px 16px!important;padding:6px 16px;min-height:46px;background:var(--panel-2);border-bottom:1px solid var(--line)}
.modal>p{margin-top:0}
#toasts{position:fixed;right:16px;bottom:16px;z-index:130;display:flex;flex-direction:column-reverse;gap:8px;width:min(360px,calc(100% - 32px))}
.toast{padding:10px 14px;background:var(--ink);color:var(--panel);border-left:4px solid var(--ink-3);font-size:12.5px;animation:slide .14s;box-shadow:var(--pop)}
.toast.bad{border-left-color:var(--bad)} .toast.ok{border-left-color:var(--good)}

/* request log drawer */
.dock{position:fixed;left:var(--side-w);right:0;bottom:0;height:44vh;z-index:30;background:var(--panel);border-top:1px solid var(--line-2);display:flex;flex-direction:column;transform:translateY(102%);transition:transform .16s;box-shadow:var(--pop)}
.dock.open{transform:none}
.dock-bar{display:flex;align-items:center;gap:10px;padding:6px 14px;border-bottom:1px solid var(--line);background:var(--panel-2);min-height:42px}
.dock-bar b{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.dock-bar .path{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;word-break:normal}
.dock-body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(280px,38%) 1fr}
.logl{overflow:auto;border-right:1px solid var(--line)}
.logr{padding:6px 14px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:8px;align-items:center;font-size:12.5px}
.logr:hover{background:var(--panel-2)}
.logr.on{background:var(--accent-soft)}
.logd{overflow:auto;padding:14px 18px;min-height:0}

/* guide */
.steps{display:grid;gap:0;padding:0;margin:0;counter-reset:s}
.steps>li{list-style:none;counter-increment:s;display:grid;grid-template-columns:24px 1fr;gap:12px;align-items:start;padding:11px 0;border-top:1px solid var(--line)}
.steps>li:first-child{border-top:0}
.steps>li::before{content:counter(s);width:24px;height:24px;border:1.5px solid var(--accent);background:var(--panel);color:var(--accent);display:grid;place-items:center;font-family:var(--mono);font-weight:500;font-size:11.5px}
.stack{display:flex;flex-direction:column}
.sec{font:700 11px var(--sans);text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);margin:26px 0 10px}
.statusrow{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);font-size:12.5px}
.statusrow:last-child{border-bottom:0}

/* id picker */
.idpick{display:flex;gap:6px;align-items:stretch}
.idpick>input{flex:1;min-width:0}
.idpick>.btn{flex:none;padding:0 10px;gap:5px;height:36px}
/* appearance */
.sect{font:700 11px var(--sans);text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);margin:2px 0 -4px}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.theme-card{display:flex;flex-direction:column;border:2px solid var(--line);background:none;padding:0;text-align:left;border-radius:var(--radius);overflow:hidden;color:var(--ink)}
.theme-card:hover{border-color:var(--ink-2)}
.theme-card[aria-pressed="true"]{border-color:var(--accent)}
.theme-prev{height:88px;padding:10px;position:relative;background-color:var(--bg);background-image:var(--pattern);background-size:var(--pattern-size)}
.theme-prev .pp{background:var(--panel);border:1px solid var(--line-2);padding:8px 10px}
.theme-prev .pp i{display:block;height:5px;background:var(--line-2);margin-bottom:6px;width:70%}
.theme-prev .pp i+i{width:45%;background:var(--ink-3)}
.theme-prev .sw{position:absolute;left:10px;right:10px;bottom:10px;display:flex;gap:4px}
.theme-prev .sw span{height:12px;flex:1;border:1px solid var(--line-2)}
.theme-meta{flex:1;padding:8px 10px;background:var(--panel);border-top:1px solid var(--line);font-size:12px}
.theme-meta b{display:block;font-size:13px}
.theme-meta span{color:var(--ink-3)}
.fonts{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.font-card{border:2px solid var(--line);background:var(--panel);padding:12px 14px;text-align:left;border-radius:var(--radius);color:var(--ink)}
.font-card:hover{border-color:var(--ink-2)}
.font-card[aria-pressed="true"]{border-color:var(--accent)}
.font-card .fh{font-size:24px;line-height:1.15;font-weight:600}
.font-card .fb{font-size:13px;color:var(--ink-2);margin-top:4px}
.font-card .fm{font-size:12px;margin-top:6px;color:var(--ink-3)}
.font-card .fn{display:flex;justify-content:space-between;gap:8px;font-family:var(--sans);font-size:12px;margin-top:10px;padding-top:8px;border-top:1px solid var(--line)}
.font-card .fn b{font-size:13px;white-space:nowrap}
.font-card .fn span{color:var(--ink-3)}

/* =========================================================
   Responsive
   ========================================================= */
@media(max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .side{flex-direction:row;align-items:center;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line-2)}
  .side .mark,.side-foot,.nav-title{display:none}
  .nav{display:flex;gap:2px;padding:0;overflow-x:auto;overflow-y:hidden;flex:none}
  .nav button{white-space:nowrap;border-left:0;border-bottom:3px solid transparent;height:42px;width:auto}
  .nav button.on{border-bottom-color:var(--accent)}
  .dock{left:0}
  .content{padding:16px 16px 64px}
  .top{flex-wrap:wrap;min-height:52px;padding:6px 16px;gap:6px}
  .top h1{font-size:22px}
  .env{display:none}
  .g2,.g3,.g4,.auto-w{grid-template-columns:1fr}
  .dock-body{grid-template-columns:1fr;grid-template-rows:40% 60%}
}
@media(max-width:640px){
  .who>button .who-name{display:none}
  .fields{grid-template-columns:minmax(0,1fr)}
  .menu{width:min(330px,calc(100vw - 32px))}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}.live-btn .pulse{animation:none!important}}

   ========================================================= */

const remaining = () => {

let lastAutoTry = 0;

  $$('[data-tok="life"]').forEach((e) => { e.textContent = has ? S.session.expiresIn + ' s' : 'none'; });

    h('div', { class: 'ep-b' },

  if (S.last[spec.id]) { const r = S.last[spec.id]; lastSig = sigOf(r); show(r); }

/* ====================== endpoint specs ====================== */
const hintFor = (res) => {
  const msg = errOf(res);
  if (res.status === 0) return 'The service could not be reached. Use Check service.';
  if (res.status === 401) return 'The token was rejected. Renew it from the top bar or sign in again.';
  if (/Invalid account number/i.test(msg)) return 'No stored account matches this M-Pesa number, or the match is frozen, has no full name, or shares the number with another active account. The Saved accounts view shows which, in its Lookup column.';
  if (/Invalid shortcode/i.test(msg)) return 'The shortcode must equal HAKIKISHA_SHORTCODE on the service (600992 by default).';
  if (/Missing required fields/i.test(msg)) return 'The account number and the shortcode are both required.';
  return '';
};

const readiness = (a) => {

};
const fmtSynced = (iso) => {

    nav.appendChild(h('button', { 'data-id': s.id, type: 'button', onclick: () => go(s.id) }, icon(s.icon, 16), s.label));
  });
  const logo = h('span', { class: 'logo' });
  logo.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square" stroke-linejoin="miter"><path d="M3.5 12L12 5l8.5 7"/><path d="M7 10.5V19h10v-8.5"/></svg>';
  const side = h('aside', { class: 'side' },
    h('div', { class: 'mark' }, logo, h('div', null, 'Premisave', h('small', null, 'C2B Hakikisha Console'))),
    nav,
    h('div', { class: 'side-foot' },
      h('button', { class: 'foot-btn', type: 'button', id: 'foot-creds', onclick: () => openCreds() }, icon('user', 16), 'Credentials'),
      h('button', { class: 'foot-btn', type: 'button', id: 'foot-conn', onclick: openSettings }, icon('gear', 16), 'Connection'),
      h('button', { class: 'foot-btn', type: 'button', id: 'foot-look', onclick: openAppearance }, icon('palette', 16), 'Appearance', h('span', { class: 'tn', 'data-theme-name': '' }, themeName())),
      h('button', { class: 'svc', type: 'button', id: 'health', title: 'Check the service', onclick: () => checkService() }, h('span', { class: 'dot', 'data-health': 'dot' }), h('span', { 'data-health': 'text' }, 'Not checked'))));
  const logBtn = h('button', { class: 'icon-btn', id: 'log-btn', type: 'button', title: 'Request log', 'aria-label': 'Toggle request log', onclick: () => toggleLog() }, icon('list', 16));
  const themeBtn = h('button', { class: 'icon-btn', id: 'theme-btn', type: 'button', title: 'Appearance', 'aria-label': 'Choose theme and font', onclick: openAppearance }, icon('palette', 16));
  const tokBtn = h('button', { class: 'live-btn off', id: 'tok-btn', type: 'button', title: 'Renew the access token now', onclick: (e) => renewClick(e.currentTarget) }, h('span', { class: 'pulse' }), h('span', null, 'No token'));
  const main = h('div', { class: 'main' },
    h('header', { class: 'top' },
      h('h1', { id: 'screen-title' }, ''),
      h('span', { class: 'env', title: 'Service address' }, S.cfg.baseUrl),
      h('span', { class: 'spacer' }), tokBtn, liveControl(), logBtn, themeBtn, h('div', { class: 'who', id: 'who' })),
    h('div', { class: 'content' }, h('main', { id: 'main', class: 'page' })));
  app.appendChild(h('div', { class: 'shell' }, side, main));
  refreshWho(); syncLookUi();
}
bus.addEventListener('auth', () => { refreshWho(); drawTok(); });

/* account menu */
let menuEl = null;
function closeMenu() { if (menuEl) { menuEl.remove(); menuEl = null; } }
function refreshWho() {
  const box = $('#who'); if (!box) return;
  closeMenu();
  const name = S.creds ? S.creds.username : (S.session ? S.session.username : '');
  box.replaceChildren(h('button', { type: 'button', id: 'who-btn', 'aria-haspopup': 'true', title: name ? 'Signed in as ' + name : 'Not signed in', onclick: (e) => { e.stopPropagation(); toggleMenu(); } },
    h('span', { class: 'avatar' }, (name || '?').slice(0, 1).toUpperCase()),
    h('span', { class: 'who-name small', style: { fontWeight: 600 } }, name || 'Signed out'),
    h('span', { class: 'chip', 'data-tok': 'whochip' }, 'signed out')));
  drawTok();
}
function toggleMenu() {
  if (menuEl) { closeMenu(); return; }
  const name = S.creds ? S.creds.username : '';
  menuEl = h('div', { class: 'menu', role: 'menu', id: 'who-menu' },
    h('div', { style: { padding: '8px 8px 6px' } }, h('div', { style: { fontWeight: 600 } }, name || 'Not signed in'), h('div', { class: 'muted mono', style: { fontSize: '11px' } }, S.cfg.baseUrl)),
    h('hr'),
    h('div', { class: 'it', role: 'menuitem', tabindex: '0', onclick: () => { closeMenu(); renewClick(); } }, icon('refresh', 16), 'Renew token'),
    h('div', { class: 'it', role: 'menuitem', tabindex: '0', onclick: () => { closeMenu(); openCreds(); } }, icon('user', 16), S.creds ? 'Edit credentials' : 'Sign in'),
    S.saved ? h('div', { class: 'it', role: 'menuitem', tabindex: '0', onclick: () => { closeMenu(); forgetSaved(); } }, icon('x', 16), 'Forget saved credentials') : null,
    S.creds || S.session ? h('div', { class: 'it', role: 'menuitem', tabindex: '0', onclick: () => { closeMenu(); signOut(); } }, icon('out', 16), 'Sign out') : null,
    h('hr'),
    h('div', { class: 'it', role: 'menuitem', tabindex: '0', onclick: () => { closeMenu(); openSettings(); } }, icon('gear', 16), 'Connection'),
    h('div', { class: 'it', role: 'menuitem', tabindex: '0', onclick: () => { closeMenu(); openAppearance(); } }, icon('palette', 16), 'Appearance'));
  $('#who').append(menuEl);
  setTimeout(() => document.addEventListener('click', function close(e) { if (menuEl && !$('#who').contains(e.target)) closeMenu(); document.removeEventListener('click', close); }), 0);
}

/* ====================== dialogs ====================== */
function openCreds() {
  modal((box, close) => {
    const src = S.creds || S.saved || {};
    const user = h('input', { type: 'text', value: src.username || '', autocomplete: 'username', spellcheck: 'false', placeholder: 'HAKIKISHA_USERNAME', id: 'cd-user' });
    const pass = h('input', { type: 'password', value: src.password || '', autocomplete: 'current-password', placeholder: 'HAKIKISHA_PASSWORD', id: 'cd-pass' });
    const show = h('button', { class: 'btn sm', type: 'button', style: { height: '36px' }, onclick: () => { const on = pass.type === 'password'; pass.type = on ? 'text' : 'password'; show.textContent = on ? 'Hide' : 'Show'; } }, 'Show');
    const remember = h('input', { type: 'checkbox', id: 'cd-remember', checked: !!S.saved || !S.creds });
    const err = h('div', { class: 'notice bad hidden', id: 'cd-error' });
    const submit = h('button', { class: 'btn primary', type: 'submit', id: 'cd-submit' }, 'Get token');
    const fail = (msg) => { err.textContent = msg; err.classList.remove('hidden'); };
    const form = h('form', { class: 'col', style: { margin: '12px 0' }, onsubmit: async (e) => {
      e.preventDefault();
      const username = user.value.trim(), password = pass.value;
      if (!username || !password) { fail('Enter both a username and a password.'); return; }
      err.classList.add('hidden');
      const res = await withBusy(submit, () => requestToken(username, password));
      if (!res.ok) { fail(res.message); return; }
      storeCreds({ username, password }, remember.checked);
      close(); renderMain();
      toast('Credentials saved and a new token issued', 'ok');
    } },
      h('p', { class: 'muted', style: { margin: 0 } }, 'The service issues a token for these credentials. Tick the box to keep them in this browser so a renewal never needs this form again.'),
      field('Username', user), field('Password', h('div', { class: 'idpick' }, pass, show)),
      h('label', { class: 'chk' }, remember, 'Save these credentials in this browser'),
      err,
      h('div', { class: 'row', style: { justifyContent: 'space-between' } },
        h('div', { class: 'row' },
          h('button', { class: 'btn', type: 'button', id: 'cd-clear', onclick: () => { user.value = ''; pass.value = ''; err.classList.add('hidden'); user.focus(); } }, 'Clear fields'),
          S.saved ? h('button', { class: 'btn danger', type: 'button', id: 'cd-forget', onclick: () => { forgetSaved(); user.value = ''; pass.value = ''; remember.checked = true; } }, 'Forget saved') : null),
        h('div', { class: 'row' }, h('button', { class: 'btn', type: 'button', onclick: close }, 'Cancel'), submit)));
    box.append(h('h3', null, 'Hakikisha credentials'), form);
    setTimeout(() => (user.value ? pass : user).focus(), 30);
  });
}

function openSettings() {
  modal((box, close) => {
    const f = {
      baseUrl: h('input', { type: 'text', value: S.cfg.baseUrl, spellcheck: 'false', id: 'cfg-base' }),
      shortcode: h('input', { type: 'text', value: S.cfg.shortcode, id: 'cfg-shortcode' }),
      timeout: h('input', { type: 'number', value: S.cfg.timeout, min: '1', id: 'cfg-timeout' })
    };
    const result = h('div', { class: 'notice hidden', id: 'cfg-result' });
    const check = h('button', { class: 'btn', type: 'button', id: 'cfg-check', onclick: async () => {
      const r = await withBusy(check, () => probe(f.baseUrl.value.trim() || S.cfg.baseUrl));
      result.className = 'notice ' + (r.state === 'ok' ? 'ok' : r.state === 'cors' ? 'warn' : 'bad'); result.textContent = r.text;
    } }, 'Check connection');
    box.append(h('h3', null, 'Connection'),
      h('div', { class: 'col', style: { margin: '12px 0' } },
        field('C2B Hakikisha service URL', f.baseUrl, '(default ' + DEFAULTS.baseUrl + ')'),
        field('Shortcode', f.shortcode, '(HAKIKISHA_SHORTCODE, default ' + DEFAULTS.shortcode + ')'),
        field('Request timeout (seconds)', f.timeout),
        h('div', { class: 'row' }, check, h('button', { class: 'btn ghost', type: 'button', onclick: () => { f.baseUrl.value = DEFAULTS.baseUrl; f.shortcode.value = DEFAULTS.shortcode; f.timeout.value = DEFAULTS.timeout; } }, 'Restore defaults')),
        result,
        h('div', { class: 'notice' }, 'This page runs from ' + location.origin + '. The service allows any origin by default (CORS_ALLOWED_ORIGINS=*). If you restricted it, add this origin. A file opened from disk reports its origin as null; serve it instead, for example with: python3 -m http.server 3000')),
      h('div', { class: 'row', style: { justifyContent: 'space-between' } },
        h('button', { class: 'btn danger', type: 'button', id: 'cfg-reset', onclick: async () => {
          if (await confirmBox('Reset', 'Clear every saved setting, credential and token from this browser?', true, 'Reset')) {
            [localStorage, sessionStorage].forEach((st) => { try { Object.keys(st).filter((k) => /^(hk-|c2b_hk_)/.test(k)).forEach((k) => st.removeItem(k)); } catch (e) { /* ignore */ } });
            location.reload();
          }
        } }, 'Reset all'),
        h('div', { class: 'row' }, h('button', { class: 'btn', type: 'button', onclick: close }, 'Cancel'), h('button', { class: 'btn primary', type: 'button', id: 'cfg-save', onclick: () => {
          const old = S.cfg.shortcode;
          S.cfg.baseUrl = f.baseUrl.value.trim().replace(/\/+$/, '') || DEFAULTS.baseUrl;
          S.cfg.shortcode = f.shortcode.value.trim() || DEFAULTS.shortcode;
          S.cfg.timeout = Number(f.timeout.value) || DEFAULTS.timeout;
          saveCfg();
          if (old !== S.cfg.shortcode && S.form.lookup) delete S.form.lookup.shortcode;
          const env = $('.env'); if (env) env.textContent = S.cfg.baseUrl;
          S.health = null; drawHealth();
          close(); renderMain(); toast('Settings saved', 'ok'); checkService();
        } }, 'Save'))));
  });
}

/* ====================== request log dock ====================== */
let logErrorsOnly = false;
function toggleLog(force) {
  const dock = $('.dock'); if (!dock) return;
  const open = force === undefined ? !dock.classList.contains('open') : force;
  dock.classList.toggle('open', open);
  const b = $('#log-btn'); if (b) b.setAttribute('aria-pressed', String(open));
  if (open) drawLog();
}
function buildDock() {
  const bar = h('div', { class: 'dock-bar' },
    h('b', null, 'Requests'), h('span', { class: 'chip plain', id: 'log-count' }, '0'), h('span', { class: 'path', id: 'log-last' }, 'Nothing sent yet'),
    h('label', { class: 'chk tiny' }, h('input', { type: 'checkbox', onchange: (e) => { logErrorsOnly = e.target.checked; drawLog(); } }), 'Errors only'),
    h('button', { class: 'btn sm', type: 'button', id: 'log-clear', onclick: () => { S.log.length = 0; S.sel = null; drawLog(); toast('Request log cleared'); } }, 'Clear'),
    h('button', { class: 'btn sm', type: 'button', onclick: () => copy(JSON.stringify(S.log.map((e) => Object.assign({}, e, { token: undefined })), null, 2), 'Log') }, 'Copy log'),
    h('button', { class: 'icon-btn', type: 'button', title: 'Close', 'aria-label': 'Close request log', onclick: () => toggleLog(false) }, icon('x', 16)));
  const list = h('div', { class: 'logl', id: 'logl' });
  const det = h('div', { class: 'logd', id: 'logd' }, h('div', { class: 'muted' }, 'Select a request.'));
  document.body.appendChild(h('div', { class: 'dock' }, bar, h('div', { class: 'dock-body' }, list, det)));
  bus.addEventListener('log', drawLog);
}
function drawLog() {
  const list = $('#logl'); if (!list) return;
  clear(list);
  $('#log-count').textContent = S.log.length;
  const last = S.log[0];
  $('#log-last').textContent = last ? last.method + ' ' + last.url + '  ' + (last.status || 'ERR') + '  ' + last.ms + 'ms' : 'Nothing sent yet';
  const rows = S.log.filter((e) => !logErrorsOnly || e.status >= 400 || !e.status).slice(0, 80);
  if (!rows.length) list.appendChild(h('div', { class: 'empty', style: { margin: '14px' } }, 'Every request this console sends is listed here.'));
  rows.forEach((e) => list.appendChild(h('div', { class: 'logr' + (S.sel === e.id ? ' on' : ''), onclick: () => { S.sel = e.id; drawLog(); showLog(e); } },
    h('span', { class: 'stat ' + statClass(e.status) }, e.status || 'ERR'),
    h('span', { class: 'method m-' + e.method }, e.method),
    h('span', { class: 'path grow', style: { overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', wordBreak: 'normal' } }, e.url.replace(/^https?:\/\/[^/]+/, '')),
    h('span', { class: 'muted tiny' }, e.ms + 'ms'))));
  if (!S.sel && last) showLog(last);
  if (!last) { const d = $('#logd'); if (d) { clear(d); d.appendChild(h('div', { class: 'muted' }, 'Select a request.')); } }
}
function showLog(e) {
  const d = $('#logd'); clear(d);
  d.append(...[
    h('div', { class: 'row' }, h('span', { class: 'method m-' + e.method }, e.method), h('span', { class: 'path grow' }, e.url), h('span', { class: 'muted tiny' }, e.t.toLocaleTimeString()),
      h('button', { class: 'btn sm', type: 'button', onclick: () => copy(curlOf(e), 'cURL command') }, 'Copy cURL')),
    h('h4', { style: { margin: '10px 0 4px' } }, 'Request headers'), jsonView(e.reqHeaders),
    e.reqBody !== null && e.reqBody !== undefined ? [h('h4', { style: { margin: '10px 0 4px' } }, 'Request body'), jsonView(e.reqBody)] : null,
    h('h4', { style: { margin: '10px 0 4px' } }, 'Response ' + (e.status || 'ERR')), jsonView(e.resBody === undefined ? null : e.resBody)].flat().filter(Boolean));
}

/* ====================== boot ====================== */
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  const m = $$('.modal-wrap'); if (m.length) m[m.length - 1].remove();
});
window.addEventListener('DOMContentLoaded', () => {
  buildShell();
  buildDock();
  go(SCREENS.some((s) => s.id === S.screen) ? S.screen : 'guide');
  checkService({ quiet: true });
  liveSchedule();
  setInterval(tick, 1000);
  if (!S.session) setTimeout(() => openCreds(), 150);
});

</script>
